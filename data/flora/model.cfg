// Wild plants (generated by tools/flora/config_flora.py): raw mesh in cs_raw, dried copy in cs_dried, hidden
// by FoodStage like the mushrooms and crops.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class geb_FloraSkeleton: Default
	{
		skeletonBones[] = { "cs_raw","", "cs_dried","" };
	};
};
class CfgModels
{
	class Default
	{
		sections[] = {};
		sectionsInherit = "";
		skeletonName = "";
	};
	class geb_FloraBase: Default
	{
		skeletonName = "geb_FloraSkeleton";
		sections[] = { "cs_raw", "cs_dried" };
		class Animations
		{
			class CS_Raw
			{
				type = "hide";
				source = "user";
				selection = "cs_raw";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.01;
			};
			class CS_Dried
			{
				type = "hide";
				source = "user";
				selection = "cs_dried";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.01;
			};
		};
	};
	class ginseng: geb_FloraBase {};
};
