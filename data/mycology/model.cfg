// Mushroom models: a raw mesh in cs_raw and a dried copy in cs_dried (see config.cpp hiddenSelections).
// FoodStage.UpdateVisualsEx hides every hidden selection but the current stage's with
// SetAnimationPhase(name, 1) and retextures the one it shows, so each selection needs its own bone,
// a hide animation and a section. Laid out like the vanilla mushrooms (DZ\gear\food\mushroom_*.p3d):
// discrete skeleton, cs_* bones without parents, hide animations named after the CS_* entries of
// FoodAnimationSources with source "user", shown at phase 0 and hidden from 0.01 up.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class geb_MushroomSkeleton: Default
	{
		skeletonBones[] =
		{
			"cs_raw","",
			"cs_dried",""
		};
	};
};
class CfgModels
{
	class Default
	{
		sections[] = {};
		sectionsInherit = "";
		skeletonName = "";
	};
	class geb_MushroomBase: Default
	{
		skeletonName = "geb_MushroomSkeleton";
		sections[] =
		{
			"cs_raw",
			"cs_dried"
		};
		class Animations
		{
			class CS_Raw
			{
				type = "hide";
				source = "user";
				selection = "cs_raw";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.01;
			};
			class CS_Dried
			{
				type = "hide";
				source = "user";
				selection = "cs_dried";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.01;
			};
		};
	};
	class amethystdeceiver: geb_MushroomBase {};
	class baybolete: geb_MushroomBase {};
	class beefsteak: geb_MushroomBase {};
	class birchbolete: geb_MushroomBase {};
	class blackmorel: geb_MushroomBase {};
	class brownrollrim: geb_MushroomBase {};
	class cauliflower: geb_MushroomBase {};
	class chanterelle: geb_MushroomBase {};
